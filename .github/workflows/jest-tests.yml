name: Jest Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  jest-tests:
    name: Jest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm ci

      - name: Run Jest
        working-directory: packages/join-flow
        run: npm test

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only Prettier is needed, so skip the postinstall (Composer and the
      # join-flow install).
      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check packages/join-flow packages/join-e2e

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # TypeScript, plus each package's dependencies. The root postinstall
      # also runs Composer, which the type check doesn't need, so it's
      # skipped and join-flow's dependencies are installed directly.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix packages/join-flow ci
          npm --prefix packages/join-e2e ci

      # The join form and its Jest tests, the E2E tests and the fake API.
      - name: Type check
        run: npm run typecheck
