name: Jest Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  jest-tests:
    name: Jest tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm ci

      - name: Run Jest
        working-directory: packages/join-flow
        run: npm test

      # The type check reuses this job's install of join-flow's dependencies
      # (from the root postinstall) and only adds the E2E package's.
      - name: Install E2E deps
        run: npm --prefix packages/join-e2e ci

      # The join form and its Jest tests, the E2E tests and the fake API.
      - name: Type check
        run: npm run typecheck

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only Prettier is needed, so skip the postinstall (Composer and the
      # join-flow install).
      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check packages/join-flow packages/join-e2e

