# WordPress for the Playwright E2E suite. Managed by scripts/env.sh; see the
# "End-to-end tests" section of the root readme.
#
# Pinned versions: bump the WordPress and WP-CLI image tags together when a new
# WordPress release comes out, then run the suite.
name: join-e2e

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - ../join-block:/var/www/html/wp-content/plugins/join-block
  - ./scripts:/var/www/html/wp-content/e2e-scripts
  # Trust the fake API's test CA: PHP's curl and streams, WordPress's own
  # HTTP API (via a must-use plugin) and the Stripe and Chargebee SDKs each have their own CA
  # setting. Nothing may be mounted over WordPress's core files: the image
  # copies them into the volume on first start and fails if one is in the way.
  - ./fake-api/certs/ca.crt:/usr/local/share/e2e-fake-api-ca.crt:ro
  - ./fake-api/php-ca.ini:/usr/local/etc/php/conf.d/zz-e2e-fake-api-ca.ini:ro
  - ./fake-api/e2e-fake-api-ca.php:/var/www/html/wp-content/mu-plugins/e2e-fake-api-ca.php:ro
  - ./fake-api/certs/ca.crt:/var/www/html/wp-content/plugins/join-block/vendor/stripe/stripe-php/data/ca-certificates.crt:ro
  - ./fake-api/certs/ca.crt:/var/www/html/wp-content/plugins/join-block/vendor/chargebee/chargebee-php/lib/ssl/ca-certs.crt:ro

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  # Stands in for every third-party API the plugin calls. Inside this network
  # the aliases below resolve here instead of to the real services. Tests talk
  # to its control API on localhost:8890 (tests/settings/fake-api.ts).
  fake-api:
    image: node:22.23.4-alpine
    command: ['node', '/app/server.js']
    volumes:
      - ./fake-api:/app:ro
    ports:
      - '8890:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      default:
        # Keep in step with fake-api/certs/san.cnf.
        aliases:
          - api.stripe.com
          - actionnetwork.org
          - api.zetk.in
          - api.dev.zetkin.org
          - us1.api.mailchimp.com
          - e2e.eu.auth0.com
          - api.gocardless.com
          - api-sandbox.gocardless.com
          - e2e.chargebee.com
          - api.postcodes.io
          - api.getaddress.io
          - api.ideal-postcodes.co.uk

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.3-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
      fake-api:
        condition: service_healthy
    ports:
      - '8889:80'
    volumes: *wordpress-volumes
    environment:
      <<: *wordpress-environment
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('SCRIPT_DEBUG', true);

  # WP-CLI, kept running so commands start quickly:
  # docker compose exec cli wp <command> (or scripts/env.sh wp <command>)
  cli:
    image: wordpress:cli-2.12.0-php8.2
    command: ['sleep', 'infinity']
    init: true
    user: '33:33'
    depends_on:
      - wordpress
    volumes: *wordpress-volumes
    environment: *wordpress-environment

volumes:
  wordpress:
